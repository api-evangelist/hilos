aid: hilos
name: Hilos
description: >-
  Hilos is a WhatsApp Business Platform automation company (backed by 500 Global and Techstars, now
  part of ActiveCampaign) that helps businesses capture leads, qualify prospects, and automate
  follow-ups over WhatsApp's Cloud API. Its REST API exposes contacts, inbox conversations, WhatsApp
  message templates, and no-code flow executions, authenticated with an `Authorization: Token` API
  key against https://api.hilos.io/api/ and paginated with `page` / `page_size` query parameters.
