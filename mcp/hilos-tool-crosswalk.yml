summary: >-
  The MCP surface and the REST surface do not overlap at all. Hilos's only reachable MCP server is the
  Mintlify documentation server: it searches and reads docs. Every one of the 19 REST operations —
  contacts, conversations, WhatsApp templates, flow executions, users — has no tool behind it. This is a
  total divergence, and it is the single most useful thing this crosswalk records: an agent can learn
  about Hilos over MCP but cannot act on Hilos over MCP.
